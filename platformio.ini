; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: convenient for uploading to the target
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; ZWEI ENVS, BEIDE SIND TESTUMGEBUNGEN - pico_test und esp32_test. Es gibt hier bewusst keine
; Produktions-Env mehr: dieses Repository ist eine Library, kein Programm. Gebaut und geprüft
; wird ausschließlich über "pio test":
;
;     pio test -e pico_test
;     pio test -e esp32_test
;
; Nur übersetzen, ohne Gerät am Kabel:
;
;     pio test -e pico_test --without-uploading --without-testing
;
; "pio run" ist KEIN Einstiegspunkt und scheitert im Linker mit "undefined reference to `setup'".
; Der Grund: setup() und loop() kommen aus test/test_tpuart/test_main.cpp, und dieser Ordner wird
; nur bei einem Testlauf mitübersetzt. Zum Aufräumen taugt "pio run" trotzdem, das Ziel kommt vor
; dem Linker: "pio run -t clean -e pico_test".
;
; Hier hing zwischenzeitlich ein pre-Script (scripts/test_env_guard.py) davor, das den Fall abfing
; und statt der Linkermeldung einen Hinweis ausgab. Es prüfte nichts und baute nichts - reine
; Benutzerinfo, dafür ein Python-Hook bei jedem Bau. Es ist weg.
;
; Hier standen einmal drei Produktions-Envs (pico_uart, pico_serial, esp32_uart) samt einem
; Diagnose-Tool in src/main.cpp, das sie mit setup()/loop() versorgte. Beide sind weg. Was die
; drei tatsächlich prüften - dass sich jedes Interface samt DataLinkLayer übersetzen und linken
; lässt - steht jetzt in test/test_tpuart/interface_check.cpp und läuft in beiden Testumgebungen
; mit. Mit main.cpp entfielen zugleich der build_src_filter dieser Envs und der srcFilter in
; library.json: beide gab es nur, um dessen zweites setup()/loop() aus dem Bau zu halten.

[env]
; direct: keine Filterung/Umkodierung durch den Monitor - nötig, damit ANSI-Farbcodes unverändert
; durchgereicht und vom Terminal interpretiert werden.
monitor_filters = direct

; Muss zu Serial.begin(115200) in test/test_tpuart/test_main.cpp passen. PlatformIOs Vorgabe wäre
; 9600. Auf dem RP2040 fiel das nie auf, weil Serial dort ein USB-CDC ist - die Baudrate ist reine
; Zierangabe, übertragen wird mit USB-Geschwindigkeit. Beim ESP32 hängt am Serial ein echter UART
; über den Brückenchip, und dort liest der Monitor bei falscher Zahl nur Buchstabensalat.
; Der Testläufer selbst benutzt test_speed (Vorgabe 115200) und war deshalb nicht betroffen.
monitor_speed = 115200

; test_build_src muss ausdrücklich an, sonst übersetzt der Testbau src/ überhaupt nicht und die
; Library fehlte. Das Dummy-Interface liegt in test/test_tpuart/ und wird dort automatisch
; mitgebaut.
; TPUART_TX_CONFIRM_TIMEOUT_MS wird für die Tests von 10s auf 1s gesenkt. Zwei Fälle hängen daran - der
; Wachhund, der bei ausbleibendem L_Data.con einen Reset auslöst, und die Auffrischung der Frist durch
; jedes Echo. Beide brauchen ECHTE Wartezeit, weil es keine stellbare Uhr gibt; mit dem Vorgabewert
; dauerte allein der Wachhund-Fall zehn Sekunden. Geprüft wird damit der Mechanismus, nicht die Zahl.
; TPUART_TICK_RATE_WINDOW_MS geht aus demselben Grund von 2s auf 200ms: der Wächter über die erreichte
; Taktrate braucht ein Fenster, in dem NICHT getickt wird, und das kostet auf der Hardware echte Zeit.
; Geprüft wird auch hier der Mechanismus, nicht die Zahl.
build_flags =
	-D TPUART_TX_CONFIRM_TIMEOUT_MS=1000
	-D TPUART_TICK_RATE_WINDOW_MS=200
test_build_src = yes

[env:pico_test]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#79ce473e1a8010ed8096388690222fd2c94858a6
platform_packages = framework-arduinopico @ https://github.com/earlephilhower/arduino-pico/releases/download/5.6.0/rp2040-5.6.0.zip
board = pico
framework = arduino
board_build.core = earlephilhower

; Hier stand zwischenzeitlich eine zweite Env, die über J-Link flashen sollte - weil der USB-Port des
; RP2040 am Ende jedes Testlaufs verschwand. Die Ursache lag aber nicht am USB, sondern in PlatformIOs
; Unity-Anbindung: deren unityOutputComplete() ruft Serial.end(), und das meldet auf dieser Plattform das
; Gerät vom Bus ab (siehe test/test_tpuart/unity_config.h). Mit eigener unity_config.h läuft der Upload
; ganz normal über USB, auch mehrfach hintereinander. Die J-Link-Env ist damit weg.

[env:esp32_test]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = esp32dev
framework = arduino

; DER SCHNELLE LAUF AUF DEM PC - dieselben Fälle, dieselbe Library, aber ohne Gerät und mit GESTELLTER
; UHR. Statt echter Fristen dreht die Testvorrichtung die Zeit in 50µs-Schritten weiter; die beiden
; Fünf-Sekunden-Fälle kosten damit nichts mehr, und der ganze Durchlauf dauert Millisekunden statt
; Sekunden.
;
; ER ERSETZT DIE HARDWARELÄUFE NICHT. Was hier nicht mehr geprüft wird, ist das Zeitverhalten selbst -
; und genau daran ist schon ein Fehler aufgefallen (die Zustellkosten des Telegramm-Callbacks
; verschoben die Pausenerkennung, siehe AGENTS.md). Eine gestellte Uhr definiert so etwas weg.
;
; MÖGLICH IST DAS OHNE EINE ZEILE ÄNDERUNG IN src/: die Library benutzt aus Arduino nur millis() und
; micros(), und die plattformgebundenen Teile schalten sich über ihre eigenen ARDUINO_ARCH_*-Klammern
; selbst ab. Den Ersatz liefert test/test_tpuart/native/Arduino.h - nur diese Env nimmt den Ordner über
; -I in den Suchpfad, in den Hardware-Envs liegt das echte Arduino.h davor.
;
; Braucht einen Host-Compiler im PATH (g++ oder clang++). Ist keiner da, scheitert die Env beim
; Übersetzen - die beiden Hardware-Envs sind davon unberührt.
[env:native_test]
platform = native
build_flags =
	${env.build_flags}
	-std=gnu++17
	-I test/test_tpuart/native
